name: Build and Push Spilo with TSL

on:
  push:
    tags:
      - 'v*' # 当你推送到一个以 v 开头的标签（如 v1.0.0）时触发
  workflow_dispatch: # 支持手动触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./postgres-appliance
          push: true
          # 替换为你的 Docker Hub 用户名和镜像名
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/spilo-17-mod-tsdb:latest
          # 核心参数：确保开启 TSL 社区版支持
          build-args: |
            WITH_PERL=true
            PGVERSION=17
            PGOLDVERSIONS=13 14 15 16
            TIMESCALEDB_APACHE_ONLY=false
            TIMESCALEDB_TOOLKIT=true
            ADDITIONAL_LOCALES=en_US
          # 使用 GitHub 缓存加速构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
